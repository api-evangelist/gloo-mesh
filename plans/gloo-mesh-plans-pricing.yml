specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Gloo Mesh
providerId: gloo-mesh
generated: '2026-09-12'
method: searched
source: https://www.solo.io/pricing
created: '2026-05-04'
modified: '2026-09-12'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that asserted Free / Professional / Enterprise tiers with
  a 1,000-request monthly quota and a 10 req/min rate limit. None of that came from Solo.io.
  It has been removed rather than left to read as published pricing (roadmap#35).
plan_count: 0
plans: []
pricing_model: contact-sales
note: >-
  Solo.io publishes NO price list and NO named tiers for Gloo Mesh. The pricing page states it
  directly: "Pricing at Solo depends on your environment and use case. There's no single price
  list because no two deployments look the same. Whether you're running a single cluster or
  managing infrastructure across dozens, we'll scope pricing around what you're actually
  building." The only call to action is "Get an Estimate", a form that routes to a specialist.
  What IS published is the LICENSE model rather than the price: Solo sells separate product
  licenses (Gloo Mesh (Gloo Platform APIs), Gloo Mesh Gateway, Solo Enterprise for Istio) and
  the docs describe precisely which capabilities each one unlocks, with unlicensed resources
  reporting ApprovalState UNLICENSED rather than failing silently. An honest plan_count of 0
  is the correct record here — there are no tiers to enumerate.
licensing:
  docs: https://docs.solo.io/gloo-mesh-enterprise/latest/setup/prepare/licensing/
  model: per-product license keys supplied through Helm values (license.value or license.secretRef)
  products:
    - name: Gloo Mesh (Gloo Platform APIs)
      unlocks: >-
        Multicluster Istio management, hardened FIPS-compliant Istio images with n-4 support,
        multitenancy and workspaces, service isolation, federation, east-west traffic
        management, Gloo CRs for internal mesh routing and policy.
    - name: Solo Enterprise for Istio
      unlocks: >-
        Hardened FIPS-compliant Istio images with n-4 support, Istio lifecycle management, and
        the insights engine that analyzes an Istio setup for health, security and resiliency.
    - name: Gloo Mesh Gateway
      unlocks: >-
        Advanced ingress routing — cloud resources and AWS Lambda, TLS for ingress routes, and
        the external auth, rate limiting and developer portal add-ons for non-mesh ingress.
  unlicensed_behavior: >-
    A resource the license does not cover reports ApprovalState UNLICENSED on its status —
    see errors/gloo-mesh-problem-types.yml.
free_access:
  - what: Open-source Istio, kgateway, agentgateway, kagent
    url: https://github.com/solo-io
  - what: Free hands-on labs and workshops
    url: https://www.solo.io/resources/lab
  - what: Product documentation, fully public, no login
    url: https://docs.solo.io/gloo-mesh-enterprise/latest/
  - what: Docs MCP server, no authentication
    url: https://search.solo.io/mcp
evidence:
  - url: https://www.solo.io/pricing
    http_status: 200
    finding: no tiers, no prices, contact-sales estimate form only
