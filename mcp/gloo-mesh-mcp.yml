    mimeType: image/svg+xml
scope:
  covers: documentation search and retrieval across the Solo.io product docs corpus
  does_not_cover: the Gloo Mesh control-plane API itself. There is no MCP tool that creates, reads or
    mutates a Gloo custom resource; the Gloo Mesh API surface is Kubernetes CRDs applied with kubectl/Helm/meshctl
    (see crd/ and cli/), and the gRPC admin service in grpc/.
