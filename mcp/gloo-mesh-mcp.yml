note: Solo.io publishes a public, unauthenticated remote MCP server for its documentation corpus. It was
  discovered from the Gloo Mesh docs UI itself ("Connect to Docs MCP" in the per-page action menu on every
  docs.solo.io/gloo-mesh-enterprise page, which opens https://search.solo.io/). The endpoint, the tool
  list and the input schemas below were read from the LIVE server over Streamable HTTP on 2026-09-12 —
  initialize and tools/list both returned 200 with no credential — not from marketing copy. `gloo-mesh-enterprise`
  is one of the 15 values of the search tool's `product` enum, so this server is an agent- reachable surface
  for THIS product specifically, not just for the company in general.
deployment:
  mode: remote
  endpoint: https://search.solo.io/mcp
  auth: none
  verified: probed
server:
  name: Solo.io - Docs MCP
  version: 1.0.0
  website_url: https://solo.io
  transport: http
  protocol_version: '2025-06-18'
  capabilities:
    logging: {}
    tools:
      listChanged: true
  icons:
