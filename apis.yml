  verdict: no-usable-base
  templated: true
  note: >-
    repair-api-bases.py returns no-usable-base for this provider and that verdict is correct,
    not a gap. Gloo Mesh has no Solo.io-operated HTTP host: its API is served by the
    CUSTOMER's own Kubernetes API server, so the baseURL on each api entry is deliberately
    templated (https://{kubernetes-api-server}/apis/). The previous baseURL values were
    docs.solo.io documentation URLs standing in for an API host. The 13 API group paths under
    that base are listed in crd/gloo-mesh-crd-index.yml.
apis:
  - aid: gloo-mesh:gloo-mesh-enterprise
    name: Gloo Mesh Enterprise
    description: >-
      Gloo Mesh Enterprise (documented as "Gloo Mesh (Gloo Platform APIs)", current version
      2.14, released 2026-09-09) is a service mesh management platform built on Istio that
      provides intra-mesh and multi-cluster routing, access policies, JWT authentication,
      external auth, rate limiting, mTLS and workload identity, fault injection, failover,
      progressive delivery and observability. Its contract is 70 Kubernetes CustomResource
      Definitions across 13 API groups, generated from 92 published proto3 definitions
      (591 messages, 45 enums, 2 gRPC services). It is deployed with the gloo-platform Helm
      charts and managed with the meshctl CLI; every write is a declarative Kubernetes apply,
      validated at admission and reporting an ApprovalState on the resource status.
    humanURL: https://docs.solo.io/gloo-mesh-enterprise/latest/
    baseURL: https://{kubernetes-api-server}/apis/
