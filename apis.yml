  - aid: gloo-mesh:gloo-mesh-core
    name: Gloo Mesh Core
    description: >-
      Gloo Mesh Core extended a single Istio service mesh with insights, operational tooling
      and lifecycle management for upstream Istio. Solo.io has RETIRED the standalone Gloo
      Mesh Core documentation set — docs.solo.io/gloo-mesh-core/ now redirects to
      docs.solo.io/istio-core/, which returns 404 (probed 2026-09-12) — and folded the
      capability into the product it markets as Solo Enterprise for Istio, whose live docs are
      at docs.solo.io/istio/. The Istio insights engine, the analyzer pipeline and the Gloo UI
      insights view are documented today inside the Gloo Mesh Enterprise doc set. This entry is
      retained with live pointers rather than dead ones; three dead documentation URLs were
      removed from it.
    humanURL: https://www.solo.io/products/istio
