aid: gloo-mesh
name: Gloo Mesh
description: >-
  Gloo Mesh is Solo.io's enterprise service mesh management platform, built on Istio and
  shipped as Kubernetes software you run in your own clusters. It provides multi-cluster and
  multi-mesh traffic management, security policy enforcement, workload identity and
  observability, with a management plane in one cluster and relay-connected agents in each
  workload cluster. Its API surface is not an HTTP endpoint but 70 Kubernetes Custom Resource
  Definitions across 13 API groups — AccessPolicy, JWTPolicy, RateLimitPolicy, RouteTable,
  VirtualDestination, VirtualGateway, Workspace and the rest — each carrying an OpenAPI v3
  structural schema and CEL validation rules, generated from 92 public protobuf definitions.
  Solo.io distributes it as the gloo-platform Helm charts and the meshctl CLI, documents it at
  docs.solo.io/gloo-mesh-enterprise, and runs an unauthenticated remote MCP server over its
  documentation corpus.
