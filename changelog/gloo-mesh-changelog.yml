  Feature changes / Bug fixes / Removed features / Known issues sections, and a comparison
  changelog that diffs any two patch or minor versions. A third tracks the Solo distributions
  of Istio down to individual patch releases (1.27.x through 1.32.x are enumerated). The
  release notes page previously pointed at by this repository
