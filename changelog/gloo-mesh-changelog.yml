entries:
  - version: '2.14'
    date: '2026-09-09'
    breaking: []
    breaking_note: No high-, medium- or low-severity breaking changes reported for this release.
    additions:
      - >-
        Istio 1.32 support — Gloo Mesh (Gloo Platform APIs) can now run with Istio 1.32.
    removals:
      - >-
        Istio 1.27 support removed in the following release; see the version support matrix.
    known_issues:
      - Cluster names must not contain underscores.
      - >-
        With Istio 1.27.7 / 1.28.4 / 1.29.0+, installing the management plane outside the
        gloo-mesh namespace requires that namespace to be listed in
        DEBUG_ENDPOINT_AUTH_ALLOWED_NAMESPACES on istiod.
      - Solo distribution of Istio 1.26.0 and 1.26.1 lack FIPS-tagged images; use 1.26.1-patch0+.
      - >-
        Istio patch 1.25.1 and 1.24.4 carry an upstream certificate-rotation bug; use 1.25.2 /
        1.24.5 or later when Gloo Mesh manages root certificate rotation.
      - Istio, and therefore Gloo Mesh, cannot run on AWS Fargate (no Istio CNI / iptables).
      - FIPS-compliant builds are not available for the OTel collector agent image.
      - >-
        Bulk route name/matcher updates in a RouteTable can delay VirtualService and
        EnvoyFilter translation, temporarily leaving policies unapplied.
