                    configs:
                      - apiKeyAuth:
                          headersFromMetadata:
                            x-solo-plan:
                              name: plan
                              required: true
                          k8sSecretApikeyStorage:
                            labelSelector:
                              auth: api-key
              ```
    
              ```yaml
              apiVersion: trafficcontrol.policy.gloo.solo.io/v2
              kind: RateLimitPolicy
