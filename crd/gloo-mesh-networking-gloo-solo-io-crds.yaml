                properties:
                  State:
                    properties:
                      approval:
                        description: |-
                          Whether the resource has been accepted as valid and processed in the Gloo
                          Mesh config translation.
                        enum:
                        - PENDING
                        - ACCEPTED
                        - INVALID
                        - WARNING
                        - FAILED
                        - UNLICENSED
                        type: string
                      message:
                        description: Additional information about the current state of
                          the resource.
                        type: string
                      observedGeneration:
                        description: |-
                          The most recent generation observed in the object's metadata.
                          If the `observedGeneration` does not match `metadata.generation`, Gloo Mesh
                          has not processed the most recent version of this object.
                        format: int64
                        type: integer
                    type: object
                  workspaceConditions:
                    additionalProperties:
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    description: |-
                      A map of ApprovalState to the number of workspaces in this condition, e.g.,
                      "Accepted" -> 2
                      "Pending" -> 1
                    type: object
                type: object
              numAppliedPolicies:
                additionalProperties:
                  maximum: 4294967295
                  minimum: 0
                  type: integer
                description: |-
                  A map of policy GVK to the number of policies that are applied on this resource,
                  sorted by GVK.
                type: object
              ownedByWorkspace:
                description: Name of the workspace that owns this ExternalWorkload
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
