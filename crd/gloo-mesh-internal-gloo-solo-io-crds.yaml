                                service, giving the impression that the upstream service is faulty.
                              oneOf:
                              - not:
                                  anyOf:
                                  - required:
                                    - httpStatus
                                  - required:
                                    - grpcStatus
                                  - required:
                                    - http2Error
                              - required:
                                - httpStatus
                              - required:
                                - grpcStatus
                              - required:
                                - http2Error
