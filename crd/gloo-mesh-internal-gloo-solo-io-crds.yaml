    app.kubernetes.io/name: gloo-mesh-apis
  name: podbouncedirectives.internal.gloo.solo.io
spec:
  group: internal.gloo.solo.io
  names:
    categories:
    - solo-io
    kind: PodBounceDirective
    listKind: PodBounceDirectiveList
    plural: podbouncedirectives
    shortNames:
    - pbd
    singular: podbouncedirective
  scope: Namespaced
  versions:
  - name: v2
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              When certificates are issued, Istio-controlled pods need to be bounced (restarted) to ensure they pick up the
              new certificates due to [this issue](https://github.com/istio/istio/issues/22993).
              The certificate issuer will create a PodBounceDirective containing the namespaces and labels
              of the pods that need to be bounced in order to pick up the new certs.
            properties:
              meshRef:
                description: Reference to the mesh on which this cert is being issued
                  for
                properties:
                  name:
                    description: name of the resource being referenced
                    type: string
                  namespace:
                    description: namespace of the resource being referenced
                    type: string
                type: object
              podsToBounce:
                description: |-
                  A list of Kubernetes pods to bounce (delete and cause a restart)
                  when the certificate is issued.
                  This will include the control plane pods as well as any Pods
                  which share a data plane with the target mesh.
                items:
                  description: pods that will be restarted.
                  properties:
                    labels:
                      additionalProperties:
                        type: string
                      description: Any labels shared by the Pods.
                      type: object
                    namespace:
                      description: The namespace in which the pods live.
                      type: string
                    rootCertSync:
                      description: |-
                        Wait for the control plane to have synced all root cert configmaps in data plane namespaces before
                        bouncing these Pods.
                      properties:
                        configMapKey:
                          type: string
                        configMapRef:
                          properties:
                            name:
                              description: name of the resource being referenced
                              type: string
                            namespace:
                              description: namespace of the resource being referenced
                              type: string
                          type: object
                        secretKey:
                          type: string
                        secretRef:
                          properties:
                            name:
                              description: name of the resource being referenced
                              type: string
                            namespace:
                              description: namespace of the resource being referenced
                              type: string
                          type: object
                      type: object
                    waitForReplicas:
                      description: |-
                        Wait for this number of replacement pods to reach be fully ready before
                        deleting the next set of selected Pods.
                        This is used to ensure the control plane pods are allowed to restart
                        before sidecars and gateways are restarted.
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                  type: object
                type: array
            type: object
          status:
            description: PodBounceDirectiveStatus reports the status for stateful Pod
              bounces (when bouncing pods requires waiting for readiness).
            properties:
              error:
                type: string
              observedGeneration:
                description: |-
                  The most recent generation observed in the PodBounceDirective metadata.
                  If the `observedGeneration` does not match `metadata.generation`, the Gloo Mesh agent has not processed the most
                  recent version of this IssuedCertificate.
                format: int64
                type: integer
              podsBounced:
                description: |-
                  A list of Kubernetes pods to bounce (delete and cause a restart)
                  when the certificate is issued.
                  This will include the control plane pods as well as any Pods
                  which share a data plane with the target mesh.
                items:
                  description: A set of pods that were restarted.
                  properties:
                    bouncedPods:
                      description: The names of the pods that were bounced for the corresponding
                        selector specified in `PodBounceDirectiveSpec.PodSelector.labels`.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              state:
                description: The current state of the IssuedCertificate workflow, reported
                  by the agent.
                enum:
                - PENDING
                - BOUNCING_PODS
                - FAILED
                - FINISHED
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    crd.solo.io/specHash: b04251b2e1b80b8d
    crd.solo.io/version: 2.14.0
  labels:
    app: gloo-mesh-apis
    app.kubernetes.io/name: gloo-mesh-apis
  name: portalconfigs.internal.gloo.solo.io
spec:
  group: internal.gloo.solo.io
  names:
    categories:
    - solo-io
    kind: PortalConfig
    listKind: PortalConfigList
    plural: portalconfigs
    shortNames:
    - pcfg
    singular: portalconfig
  scope: Namespaced
  versions:
  - name: v2
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              PortalConfig is a internal representation of the user facing Portal resource.
              It is used to provide configuration information for a single Portal backend.
              The PortalConfig contains a list of all API resources that are exposed by the Portal,
              the associated usage plans for each API, and all usage plans available
              across the Portal.
            properties:
              apis:
                description: The list of API resources that are exposed by the Portal.
                items:
                  description: |-
                    TODO(jmhbh): Update this doc when we decide to support operation level usage plans.
                    An API that is exposed by the Portal. API metadata is sourced from the
                    referenced RouteTable and api_schema is a reference to the stitched API schema for the RouteTable.
                    Also references a list of usage plan names that are associated with the API.
                  properties:
                    apiId:
                      description: The ID for this API.
                      type: string
                    apiProductDisplayName:
                      description: The api product display name
                      type: string
                    apiProductId:
                      description: |-
                        When set, the [/apis](https://docs.solo.io/gloo-mesh-gateway/latest/portal/redocly.html#tag/APIs/operation/ListAPIs)
                        endpoint in the portal will return `apiProduct` in the response which can be used to group multiple APIs together.
                      type: string
                    apiSchema:
                      properties:
                        cluster:
                          description: the cluster of the object. If omitted, Gloo Mesh
                            will use the same cluster as the parent object containing
                            this reference.
                          type: string
                        name:
                          description: the name of the object
                          type: string
                        namespace:
                          description: the namespace of the object. If omitted, Gloo Mesh
                            will use the same namespace as the parent object containing
                            this reference.
                          type: string
                      type: object
                    apiVersion:
                      description: |-
                        The version of the openAPI specification for this route table. Must be unique within the apiProduct.
                        `apiProduct` is required if `apiVersion` is set.
                      type: string
                    contact:
                      type: string
                    customMetadata:
                      additionalProperties:
                        type: string
                      type: object
                    description:
                      type: string
                    isPrivate:
                      description: |-
                        The API is private if its associated route table contains labels matching the privateAPILabels specified
                        in the portal resource
                      type: boolean
                    license:
                      type: string
                    lifecycle:
                      type: string
                    routeTable:
                      properties:
                        cluster:
                          description: the cluster of the object. If omitted, Gloo Mesh
                            will use the same cluster as the parent object containing
                            this reference.
                          type: string
                        name:
                          description: the name of the object
                          type: string
                        namespace:
                          description: the namespace of the object. If omitted, Gloo Mesh
                            will use the same namespace as the parent object containing
                            this reference.
                          type: string
                      type: object
                    termsOfService:
                      type: string
                    title:
                      type: string
                    usagePlans:
                      items:
                        description: Reference to a usage plan by name.
                        properties:
                          name:
                            type: string
                        type: object
                      type: array
                  type: object
                type: array
              domains:
                description: |-
                  The domains on which this Portal will be served. The Host header received by the
                  Portal Web App will be matched to one of these domains in order to determine which Portal will be served.
                items:
                  type: string
                type: array
              groups:
                description: The list of groups that are available across the Portal.
                items:
                  description: |-
                    A Portal group represents a set of group names, which has visibility into a set of APIs and the ability
                    to manage API keys selected usage plans.
                  properties:
                    apis:
                      description: The apis that are visible to this group
                      items:
                        description: |-
                          reference to a Kubernetes API object.
                          Kube API objects are referenced explicitly by the namespace and cluster containing them.
                        properties:
                          cluster:
                            description: the cluster of the object. If omitted, Gloo Mesh
                              will use the same cluster as the parent object containing
                              this reference.
                            type: string
                          name:
                            description: the name of the object
                            type: string
                          namespace:
                            description: the namespace of the object. If omitted, Gloo
                              Mesh will use the same namespace as the parent object containing
                              this reference.
                            type: string
                        type: object
                      type: array
                    membershipClaims:
                      description: The list of membership claims that are used to determine
                        whether a user is a member of this group
                      items:
                        description: |-
                          `Membership` contains a list of claims that is used to determine whether a user belongs to this group.
                          A user is considered to be a member of this group if their idToken has all the claims in this list.
                          For example, a user is considered to be a member of this group if they have defined the following list of membership criteria in their `PortalGroup`:
                          ```yaml
    
                          ...
                           membership:
                             - claims:
                                 - key: type
                                   value: customers
                                 - key: region
                                   value: us-east-1
                             - claims:
                                 - key: type
                                   value: customers
                                 - key: region
                                   value: us-west-1
                          ```
                          and the user has the following claims in their idToken:
                          ```json
                          { "type": "customers", "region": "us-east-1" } or { "type": "customers", "region": "us-west-1" }
                          ```
                          claims within a `Membership` criteria is an AND operation, and the list of `Membership` criteria is an OR operation.
                        properties:
                          claims:
                            description: |-
                              A list of claims that is used to determine whether a user belongs to this group.
                              A user is considered to be a member of this group if their idToken has claims that match all the claims in this list.
                            items:
                              description: A claim that can be used to define a group
                                of users.
                              properties:
                                key:
                                  description: The key of the claim. For example, `customers`
                                    or `region`. This is the key that we will use to match
                                    against the claims in the idToken.
                                  type: string
                                value:
                                  description: The value of the claim.
                                  type: string
                              type: object
                            type: array
                        type: object
                      type: array
                    name:
                      description: The name of the group this is derived from the `PortalGroup`
                        resource
                      type: string
                    usagePlans:
                      description: The names of the usage plans that are visible to this
                        group
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              portalCustomMetadata:
                description: |-
                  Portal level metadata configured by the user in the user facing Portal resource as a JSON value.
                  For information about the value format, see the [Google protocol buffer documentation](https://protobuf.dev/reference/protobuf/google.protobuf/#value).
                x-kubernetes-preserve-unknown-fields: true
              portalRef:
                description: Reference to the Portal resource that this PortalConfig resource
                  is derived from.
                properties:
                  cluster:
                    description: the cluster of the object. If omitted, Gloo Mesh will
                      use the same cluster as the parent object containing this reference.
                    type: string
                  name:
                    description: the name of the object
                    type: string
                  namespace:
                    description: the namespace of the object. If omitted, Gloo Mesh will
                      use the same namespace as the parent object containing this reference.
                    type: string
                type: object
              public:
                description: |-
                  Indicates whether the Portal is public or private, this is based on the visibility setting specified in the
                  `Portal` resource
                type: boolean
              usagePlans:
                description: The list of usage plans that are available across the Portal.
                items:
                  description: A usage plan contains a list of auth policies and one rate
                    limit policy.
                  properties:
                    description:
                      type: string
                    displayName:
                      type: string
                    extAuthPolicies:
                      items:
                        description: |-
                          An ext auth policy identified by its authentication type and contains a list of
                          unique label selectors that are used to identify the set of clients that
                          are authorized to use the auth policy.
                        oneOf:
                        - not:
                            anyOf:
                            - required:
                              - apiKeyAuth
                            - required:
                              - oidcAuth
                            - required:
                              - accessTokenValidation
                        - required:
                          - apiKeyAuth
                        - required:
                          - oidcAuth
                        - required:
                          - accessTokenValidation
                        properties:
                          accessTokenValidation:
                            properties:
                              bearerFormat:
                                type: string
                            type: object
                          apiKeyAuth:
                            properties:
                              extAuthLabelSelector:
                                additionalProperties:
                                  type: string
                                type: object
                            type: object
                          authConfigId:
                            type: string
                          extAuthPolicyRef:
                            properties:
                              cluster:
                                description: the cluster of the object. If omitted, Gloo
                                  Mesh will use the same cluster as the parent object
                                  containing this reference.
                                type: string
                              name:
                                description: the name of the object
                                type: string
                              namespace:
                                description: the namespace of the object. If omitted,
                                  Gloo Mesh will use the same namespace as the parent
                                  object containing this reference.
                                type: string
                            type: object
                          oidcAuth:
                            properties:
                              wellKnownOpenidConfig:
                                type: string
                            type: object
                        type: object
                      type: array
                    name:
                      type: string
                    rateLimitPolicy:
                      properties:
                        rateLimitPolicyRef:
                          properties:
                            cluster:
                              description: the cluster of the object. If omitted, Gloo
                                Mesh will use the same cluster as the parent object containing
                                this reference.
                              type: string
                            name:
                              description: the name of the object
                              type: string
                            namespace:
                              description: the namespace of the object. If omitted, Gloo
                                Mesh will use the same namespace as the parent object
                                containing this reference.
                              type: string
                          type: object
                        requestsPerUnit:
                          maximum: 4294967295
                          minimum: 0
                          type: integer
                        unit:
                          enum:
                          - UNKNOWN
                          - SECOND
                          - MINUTE
                          - HOUR
                          - DAY
                          type: string
                      type: object
                  type: object
                type: array
            type: object
          status:
            description: The status of the resource after it is applied to your Gloo environment.
            properties:
              common:
                description: The state and workspace conditions of the applied resource.
                properties:
                  State:
                    properties:
                      approval:
                        description: |-
                          Whether the resource has been accepted as valid and processed in the Gloo
                          Mesh config translation.
                        enum:
                        - PENDING
                        - ACCEPTED
                        - INVALID
                        - WARNING
                        - FAILED
                        - UNLICENSED
                        type: string
                      message:
                        description: Additional information about the current state of
                          the resource.
                        type: string
                      observedGeneration:
                        description: |-
                          The most recent generation observed in the object's metadata.
                          If the `observedGeneration` does not match `metadata.generation`, Gloo Mesh
                          has not processed the most recent version of this object.
                        format: int64
                        type: integer
                    type: object
                  workspaceConditions:
                    additionalProperties:
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    description: |-
                      A map of ApprovalState to the number of workspaces in this condition, e.g.,
                      "Accepted" -> 2
                      "Pending" -> 1
                    type: object
                type: object
              ownedByWorkspace:
                description: The name of the workspace that owns the PortalConfig schema.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    crd.solo.io/specHash: 3690913af546e6f5
    crd.solo.io/version: 2.14.0
  labels:
    app: gloo-mesh-apis
    app.kubernetes.io/name: gloo-mesh-apis
  name: spireregistrationentries.internal.gloo.solo.io
spec:
  group: internal.gloo.solo.io
  names:
    categories:
    - solo-io
    kind: SpireRegistrationEntry
    listKind: SpireRegistrationEntryList
    plural: spireregistrationentries
    shortNames:
    - sreg
    singular: spireregistrationentry
  scope: Namespaced
  versions:
  - name: v2alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              SpireRegistrationEntrySpec describes a registration entry in SPIRE server.
              It is a subset of the upstream RegistrationEntry API:
              https://github.com/spiffe/spire/blob/v1.6.3/proto/spire/common/common.proto#L62
            properties:
              dnsNames:
                description: DNS entries.
                items:
                  type: string
                type: array
              parentId:
                description: The SPIFFE ID of an entity that is authorized to attest the
                  validity of a selector.
                type: string
              selectors:
                description: A list of selectors.
                items:
                  description: Selector describes the conditions under which a registration
                    entry is matched.
                  properties:
                    type:
                      description: A selector type represents the type of attestation
                        used in attesting the entity.
                      type: string
                    value:
                      description: The value to be attested.
                      type: string
                  type: object
                type: array
              spiffeId:
                description: |-
                  The SPIFFE ID is a structured string used to identify a resource or caller.
                  It is defined as a URI comprising a “trust domain” and an associated path.
                type: string
              x509SvidTtl:
                description: Time to live for X509-SVIDs generated from this entry.
                maximum: 4294967295
                minimum: 0
                nullable: true
                type: integer
            type: object
          status:
            description: The status of the SpireRegistrationEntry after it is applied
              to your Gloo environment.
            properties:
              common:
                properties:
                  State:
                    properties:
                      approval:
                        description: |-
                          Whether the resource has been accepted as valid and processed in the Gloo
                          Mesh config translation.
                        enum:
                        - PENDING
                        - ACCEPTED
                        - INVALID
                        - WARNING
                        - FAILED
                        - UNLICENSED
                        type: string
                      message:
                        description: Additional information about the current state of
                          the resource.
                        type: string
                      observedGeneration:
                        description: |-
                          The most recent generation observed in the object's metadata.
                          If the `observedGeneration` does not match `metadata.generation`, Gloo Mesh
                          has not processed the most recent version of this object.
                        format: int64
                        type: integer
                    type: object
                  workspaceConditions:
                    additionalProperties:
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    description: |-
                      A map of ApprovalState to the number of workspaces in this condition, e.g.,
                      "Accepted" -> 2
                      "Pending" -> 1
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    crd.solo.io/specHash: 44c39d2b7155998d
    crd.solo.io/version: 2.14.0
  labels:
    app: gloo-mesh-apis
    app.kubernetes.io/name: gloo-mesh-apis
  name: virtualservicebackups.internal.gloo.solo.io
spec:
  group: internal.gloo.solo.io
  names:
    categories:
    - solo-io
    kind: VirtualServiceBackup
    listKind: VirtualServiceBackupList
    plural: virtualservicebackups
    singular: virtualservicebackup
  scope: Namespaced
  versions:
  - name: v2alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              spec:
                description: The VirtualService spec that is being backed up
                properties:
                  exportTo:
                    description: |-
                      A list of namespaces to which this virtual service is exported. Exporting a
                      virtual service allows it to be used by sidecars and gateways defined in
                      other namespaces. This feature provides a mechanism for service owners
                      and mesh administrators to control the visibility of virtual services
                      across namespace boundaries.
    
                      If no namespaces are specified then the virtual service is exported to all
                      namespaces by default.
    
                      The value "." is reserved and defines an export to the same namespace that
                      the virtual service is declared in. Similarly the value "*" is reserved and
                      defines an export to all namespaces.
                    items:
                      type: string
                    type: array
                  gateways:
                    description: |-
                      The names of gateways and sidecars that should apply these routes.
                      Gateways in other namespaces may be referred to by
                      `<gateway namespace>/<gateway name>`; specifying a gateway with no
                      namespace qualifier is the same as specifying the VirtualService's
                      namespace. A single VirtualService is used for sidecars inside the mesh as
                      well as for one or more gateways. The selection condition imposed by this
                      field can be overridden using the source field in the match conditions
                      of protocol-specific routes. The reserved word `mesh` is used to imply
                      all the sidecars in the mesh. When this field is omitted, the default
                      gateway (`mesh`) will be used, which would apply the rule to all
                      sidecars in the mesh. If a list of gateway names is provided, the
                      rules will apply only to the gateways. To apply the rules to both
                      gateways and sidecars, specify `mesh` as one of the gateway names.
                    items:
                      type: string
                    type: array
                  hosts:
                    description: |-
                      The destination hosts to which traffic is being sent. Could
                      be a DNS name with wildcard prefix or an IP address.  Depending on the
                      platform, short-names can also be used instead of a FQDN (i.e. has no
                      dots in the name). In such a scenario, the FQDN of the host would be
                      derived based on the underlying platform.
    
                      A single VirtualService can be used to describe all the traffic
                      properties of the corresponding hosts, including those for multiple
                      HTTP and TCP ports. Alternatively, the traffic properties of a host
                      can be defined using more than one VirtualService, with certain
                      caveats. Refer to the
                      [Operations Guide](https://istio.io/docs/ops/best-practices/traffic-management/#split-virtual-services)
                      for details.
    
                      *Note for Kubernetes users*: When short names are used (e.g. "reviews"
                      instead of "reviews.default.svc.cluster.local"), Istio will interpret
                      the short name based on the namespace of the rule, not the service. A
                      rule in the "default" namespace containing a host "reviews" will be
                      interpreted as "reviews.default.svc.cluster.local", irrespective of
                      the actual namespace associated with the reviews service. _To avoid
                      potential misconfigurations, it is recommended to always use fully
                      qualified domain names over short names._
    
                      The hosts field applies to both HTTP and TCP services. Service inside
                      the mesh, i.e., those found in the service registry, must always be
                      referred to using their alphanumeric names. IP addresses are allowed
                      only for services defined via the Gateway.
    
                      *Note*: It must be empty for a delegate VirtualService.
                    items:
                      type: string
                    type: array
                  http:
                    description: |-
                      An ordered list of route rules for HTTP traffic. HTTP routes will be
                      applied to platform service ports using HTTP/HTTP2/GRPC protocols, gateway
                      ports with protocol HTTP/HTTP2/GRPC/TLS-terminated-HTTPS and service
                      entry ports using HTTP/HTTP2/GRPC protocols.  The first rule matching
                      an incoming request is used.
                    items:
                      description: |-
                        Describes match conditions and actions for routing HTTP/1.1, HTTP2, and
                        gRPC traffic. See VirtualService for usage examples.
                      properties:
                        corsPolicy:
                          description: |-
                            Cross-Origin Resource Sharing policy (CORS). Refer to
                            [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)
                            for further details about cross origin resource sharing.
                          properties:
                            allowCredentials:
                              description: |-
                                Indicates whether the caller is allowed to send the actual request
                                (not the preflight) using credentials. Translates to
                                `Access-Control-Allow-Credentials` header.
                              nullable: true
                              type: boolean
                            allowHeaders:
                              description: |-
                                List of HTTP headers that can be used when requesting the
                                resource. Serialized to Access-Control-Allow-Headers header.
                              items:
                                type: string
                              type: array
                            allowMethods:
                              description: |-
                                List of HTTP methods allowed to access the resource. The content will
                                be serialized into the Access-Control-Allow-Methods header.
                              items:
                                type: string
                              type: array
                            allowOrigin:
                              description: |-
                                The list of origins that are allowed to perform CORS requests. The
                                content will be serialized into the Access-Control-Allow-Origin
                                header. Wildcard * will allow all origins.
                              items:
                                type: string
                              type: array
                            allowOrigins:
                              description: |-
                                String patterns that match allowed origins.
                                An origin is allowed if any of the string matchers match.
                                If a match is found, then the outgoing Access-Control-Allow-Origin would be set to the origin as provided by the client.
                              items:
                                description: |-
                                  Describes how to match a given string in HTTP headers. `exact` and `prefix` matching is
                                  case-sensitive. `regex` matching supports case-insensitive matches.
                                oneOf:
                                - not:
                                    anyOf:
                                    - required:
                                      - exact
                                    - required:
                                      - prefix
                                    - required:
                                      - regex
                                - required:
                                  - exact
                                - required:
                                  - prefix
                                - required:
                                  - regex
                                properties:
                                  exact:
                                    description: exact string match
                                    type: string
                                  prefix:
                                    description: prefix-based match
                                    type: string
                                  regex:
                                    description: |-
                                      [RE2 style regex-based match](https://github.com/google/re2/wiki/Syntax).
    
                                      Example: `(?i)^aaa$` can be used to case-insensitive match a string consisting of three a's.
                                    type: string
                                type: object
                              type: array
                            exposeHeaders:
                              description: |-
                                A list of HTTP headers that the browsers are allowed to
                                access. Serialized into Access-Control-Expose-Headers header.
                              items:
                                type: string
                              type: array
                            maxAge:
                              description: |-
                                Specifies how long the results of a preflight request can be
                                cached. Translates to the `Access-Control-Max-Age` header.
                              type: string
                            unmatchedPreflights:
                              description: |-
                                Indicates whether preflight requests not matching the configured
                                allowed origin shouldn't be forwarded to the upstream.
                                Default is forward to upstream.
                              enum:
                              - UNSPECIFIED
                              - FORWARD
                              - IGNORE
                              type: string
                          type: object
                        delegate:
                          description: |-
                            Delegate is used to specify the particular VirtualService which
                            can be used to define delegate HTTPRoute.
    
                            It can be set only when `Route` and `Redirect` are empty, and the route
                            rules of the delegate VirtualService will be merged with that in the
                            current one.
    
                            **NOTE**:
    
                            1. Only one level delegation is supported.
                            2. The delegate's HTTPMatchRequest must be a strict subset of the root's,
                               otherwise there is a conflict and the HTTPRoute will not take effect.
                          properties:
                            name:
                              description: Name specifies the name of the delegate VirtualService.
                              type: string
                            namespace:
                              description: |-
                                Namespace specifies the namespace where the delegate VirtualService resides.
                                By default, it is same to the root's.
                              type: string
                          type: object
                        directResponse:
                          description: |-
                            A HTTP rule can either return a direct_response, redirect or forward (default) traffic.
                            Direct Response is used to specify a fixed response that should
                            be sent to clients.
    
                            It can be set only when `Route` and `Redirect` are empty.
                          properties:
                            body:
                              description: |-
                                Specifies the content of the response body. If this setting is omitted,
                                no body is included in the generated response.
                              oneOf:
                              - not:
                                  anyOf:
                                  - required:
                                    - string
                                  - required:
                                    - bytes
                              - required:
                                - string
                              - required:
                                - bytes
                              properties:
                                bytes:
                                  description: response body as base64 encoded bytes.
                                  format: byte
                                  type: string
                                string:
                                  description: response body as a string
                                  type: string
                              type: object
                            status:
                              description: Specifies the HTTP response status to be returned.
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                          type: object
                        fault:
                          description: |-
