                                    properties:
                                      number:
                                        description: Valid port number
                                        maximum: 4294967295
                                        minimum: 0
                                        type: integer
                                    type: object
                                  subset:
                                    description: |-
                                      The name of a subset within the service. Applicable only to services
                                      within the mesh. The subset must be defined in a corresponding
