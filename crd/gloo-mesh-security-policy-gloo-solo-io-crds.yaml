                              properties:
                                backoff:
                                  description: |-
                                    Configure exponential backoff between retries.
                                    If omitted, retries occur with a fixed 1 second interval.
                                  properties:
                                    baseInterval:
                                      description: |-
                                        The base interval before the first retry. Must be greater than 0
                                        and less than or equal to `maxInterval`.
                                        If omitted, defaults to 1 second.
                                      type: string
                                    maxInterval:
