                                        type: string
                                      path:
                                        description: |-
                                          Must have at least one element. The path to retrieve the Value from the Struct. It can be a prefix or a full path,
                                          e.g. ``[prop, xyz]`` for a struct or ``[prop, foo]`` for a string in the example,
                                          which depends on the particular scenario.
    
                                          Note: Due to that only the key type segment is supported, the path can not specify a list
                                          unless the list is the last segment.
                                        items:
                                          description: |-
                                            Specifies the segment in a path to retrieve value from Metadata.
                                            Currently it is only supported to specify the key, i.e. field name, as one segment of a path.
                                          oneOf:
                                          - not:
                                              anyOf:
                                              - required:
                                                - key
                                          - required:
                                            - key
                                          properties:
                                            key:
                                              description: Required. If specified, use
                                                the key to retrieve the value in a Struct.
                                              type: string
                                          type: object
                                        type: array
                                    type: object
                                  source:
                                    description: Source of metadata
                                    enum:
                                    - DYNAMIC
                                    - ROUTE_ENTRY
                                    type: string
                                type: object
                              remoteAddress:
                                description: Rate limit on remote address.
                                type: object
                              requestHeaders:
                                description: Rate limit on request headers.
                                properties:
                                  descriptorKey:
                                    description: The key to use in the descriptor entry.
                                    type: string
                                  headerName:
                                    description: |-
                                      The header name to be queried from the request headers. The header’s
                                      value is used to populate the value of the descriptor entry for the
                                      descriptor_key.
                                    type: string
                                type: object
                              sourceCluster:
                                description: Rate limit on source cluster.
                                type: object
                            type: object
                          type: array
                        type:
                          description: |-
                            Optional type defining the rate limit metric, such as requests or token counts.
                            The TOKEN type is only relevant for AI backends that emit a token count and is used by agentgateway.
                            Defaults to REQUEST if not specified.
                          enum:
                          - REQUEST
                          - TOKEN
                          type: string
                      type: object
                    type: array
