                            - required:
                              - sourceCluster
                            - required:
                              - destinationCluster
                            - required:
                              - requestHeaders
                            - required:
                              - remoteAddress
                            - required:
                              - genericKey
                            - required:
                              - headerValueMatch
                            - required:
                              - metadata
                            - required:
                              - cel
                            properties:
                              cel:
                                description: Rate limit on CEL expression. Only supported
                                  for agentgateway ratelimiting.
                                properties:
                                  expression:
                                    description: The CEL expression to evaluate.
                                    type: string
